{{- range $app := .Values.apps }}
apiVersion: v1
kind: Service
metadata:
#  creationTimestamp: "2026-10-14T20:07:52Z"
  labels:
    app:
  name: {{ $app.name }}
  namespace: jenkins
#  resourceVersion: "711073"
#  uid: b137b2bd-c084-4158-96c9-dc82909bdea6
spec:
  #clusterIP: 10.43.173.49
 # clusterIPs:
  #- 10.43.173.49
  #externalTrafficPolicy: Cluster
  #internalTrafficPolicy: Cluster
  #ipFamilies:
  #- IPv4
  #ipFamilyPolicy: SingleStack
  ports:
{{- if kindIs "slice" $app.containerPort }}
{{- range $index, $containerPort := $app.containerPort }}
  - name: port-{{ $index }}
    nodePort: {{ index $app.nodePort $index }}
    port: {{ index $app.servicePort $index }}
    targetPort: {{ $containerPort }}
{{- end }}
{{- else }}
  - name: {{ $app.name }}
    nodePort: {{ $app.nodePort }}
    port: {{ $app.servicePort }}
    targetPort: {{ $app.containerPort }}
{{- end }}
  selector:
    app: {{ $app.name }}
 # sessionAffinity: None
  type: NodePort
#status:
 # loadBalancer: {}
---
{{- end }}