{{- range $app := .Values.apps }}
apiVersion: apps/v1
kind: Deployment
metadata:
  generation: 1
  labels:
    app: {{ $app.name }}
  name: {{ $app.name }}
  namespace: jenkins
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ $app.name }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ $app.name }}
    spec:
      containers:
      - image: {{ $app.image }}:{{ $app.tag }}
        imagePullPolicy: IfNotPresent
        name: {{ $app.name }}
        ports:
{{- if kindIs "slice" $app.containerPort }}
{{- range $index, $port := $app.containerPort }}
          - name: port-{{ $index }}
            containerPort: {{ $port }}
{{- end }}
{{- else }}
          - containerPort: {{ $app.containerPort }}
{{- end }}
        resources:
          requests:
            cpu: {{ $.Values.resources.requests.cpu | quote }}
            memory: {{ $.Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ $.Values.resources.limits.cpu | quote }}
            memory: {{ $.Values.resources.limits.memory | quote }}


      {{ with $app.containerSecurityContext }}
        securityContext:
            runAsNonRoot: {{ .runAsNonRoot }}
            runAsUser: {{ .runAsUser }}
            runAsGroup: {{ .runAsGroup }}
            fsGroup: {{ .fsGroup }}
            allowPrivilegeEscalation: {{ .allowPrivilegeEscalation }}
            {{ end }}
        volumeMounts:
{{ range $volumeMount := $app.volumeMounts }}
          - mountPath: {{ $volumeMount.mountPath }}
            name: {{ $volumeMount.name }}
{{ end }}
      volumes:
{{ range $volumeMount := $app.volumeMounts }}
      - name: {{ $volumeMount.name }}
        persistentVolumeClaim:
          claimName: {{ printf "%s-%s" $app.name $volumeMount.name | quote }}
#        resources: {}
#        terminationMessagePath: /dev/termination-log
#        terminationMessagePolicy: File
#      dnsPolicy: ClusterFirst
        restartPolicy: Always
#      schedulerName: default-scheduler
 #     securityContext: {}
#      terminationGracePeriodSeconds: 30
#status: {}
{{ end }}
---
{{- end }}