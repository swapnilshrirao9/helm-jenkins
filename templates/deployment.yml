{{- range .Values.apps }}
apiVersion: apps/v1
kind: Deployment
metadata:
#  creationTimestamp: "2026-10-14T18:47:07Z"
  generation: 1
  labels:
    app: {{ .name }}
  name: {{ .name }}
  namespace: jenkins
#  resourceVersion: "706387"
#  uid: dbcbe3ed-1719-4d21-8eed-945342afad61
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .name }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
      - image: {{ .image }}:{{ .tag }}
        imagePullPolicy: Always
        name: {{ .name }}
        ports:
          - containerPort: {{ .containerPort }} 
#        resources: {}
#        terminationMessagePath: /dev/termination-log
#        terminationMessagePolicy: File
#      dnsPolicy: ClusterFirst
      restartPolicy: Always
#      schedulerName: default-scheduler
 #     securityContext: {}
      terminationGracePeriodSeconds: 30
#status: {}
