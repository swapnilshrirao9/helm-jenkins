{{- range $app := .Values.apps }}
{{- range $volumeMount := $app.volumeMounts }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" $app.name $volumeMount.name | quote }}
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $.Values.persistence.storageClassName }}
  volumeName: {{ $app.name }}-pv
  resources:
    requests:
      storage: {{ $app.volumes.size }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $app.name }}-pv
  namespace: jenkins
spec:
  capacity:
    storage: {{ $app.volumes.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: {{ $.Values.persistence.reclaimPolicy }}
  storageClassName: {{ $.Values.persistence.storageClassName }}
  mountOptions:
    - nfsvers=4.1
    - proto=tcp
  nfs:
    path: {{ $app.volumes.hostPath | quote }}   # The exact path exported on your master node
    server: 192.168.56.102
{{ end }}
---
{{- end }}
