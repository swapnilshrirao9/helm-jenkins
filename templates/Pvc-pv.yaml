{{- range $app := .Values.apps }}
{{- range $volume := $app.volumes }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "%s-%s-pv" $app.name $volume.name | quote }}
spec:
  capacity:
    storage: {{ $volume.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: {{ $.Values.persistence.reclaimPolicy }}
  storageClassName: {{ $.Values.persistence.storageClassName }}
  mountOptions:
    - nfsvers=4.1
    - proto=tcp
  nfs:
    path: {{ $volume.hostPath | quote }}
    server: 192.168.56.102
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" $app.name $volume.name | quote }}
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $.Values.persistence.storageClassName }}
  volumeName: {{ printf "%s-%s-pv" $app.name $volume.name | quote }}
  resources:
    requests:
      storage: {{ $volume.size }}
---
{{- end }}
{{- end }}
