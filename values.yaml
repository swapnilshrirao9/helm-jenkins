apps:
  - name: jenkins-admin
    containerPort: 8080
    servicePort: 8080
    nodePort: 31080
    image: 192.168.56.114:5000/jenkins
    tag: admin
    volumes:
      - name: jenkins-volume
        size: 2Gi
        hostPath: /home/jenkins/helm-jenkins-sonar-nexus-data/jenkins
    volumeMounts:
      - name: jenkins-volume
        mountPath: /var/jenkins_home/
           

  - name: nexus-admin
    containerPort: 8081
    servicePort: 8081
    nodePort: 31081
    image: 192.168.56.114:5000/nexus
    tag: admin
    volumes:
      - name: nexus-volume
        size: 2Gi
        hostPath: /home/jenkins/helm-jenkins-sonar-nexus-data/nexus
    volumeMounts:
      - name: nexus-volume
        mountPath: /nexus-data

  - name: sonar-admin
    containerPort: 9000
    servicePort: 9000
    nodePort: 31900
    image: 192.168.56.114:5000/swapnilsks/sonartest
    tag: latest
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 0
      allowPrivilegeEscalation: false
    volumes:
      - name: sonar-data
        size: 2Gi
        hostPath: /home/jenkins/helm-jenkins-sonar-nexus-data/sonar/data
      - name: sonar-logs
        size: 2Gi
        hostPath: /home/jenkins/helm-jenkins-sonar-nexus-data/sonar/logs
      - name: sonar-extensions
        size: 2Gi
        hostPath: /home/jenkins/helm-jenkins-sonar-nexus-data/sonar/extensions
    volumeMounts:
      - name: sonar-data
        mountPath: /opt/sonarqube/data
      - name: sonar-logs
        mountPath: /opt/sonarqube/logs
      - name: sonar-extensions
        mountPath: /opt/sonarqube/extensions
     # - name: sonar-logs
     #   mountPath: /opt/sonarqube/logs
     # - name: sonar-extensions
      #  mountPath: /opt/sonarqube/extensions

persistence:
  storageClassName: automatic
  reclaimPolicy: Retain

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 5Gi

service:
  - protocol: TCP


VolumeMount:
  - name: jenkins-vm
    mountPath: /var/jenkins_home/
