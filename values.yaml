apps:
  - name: jenkins-admin
    containerPort: 8080
    servicePort: 8080
    nodePort: 31080
    image: 192.168.56.114:5000/jenkins
    tag: admin
    volumeMounts:
      - name: jenkins
        mountPath: /var/jenkins_home/
        size: 2Gi
        hostPath: /home/jenkins/helm-jenkins-sonar-nexus-data/jenkins   

  - name: nexus-admin
    containerPort: 8081
    servicePort: 8081
    nodePort: 31081
    image: 192.168.56.114:5000/nexus
    tag: admin
    volumeMounts:
      - name: nexus
        mountPath: /nexus-data
        size: 2Gi
        hostPath: /home/jenkins/helm-jenkins-sonar-nexus-data/nexus-data

  - name: sonar-admin
    containerPort: 9000
    servicePort: 9000
    nodePort: 31900
    image: 192.168.56.114:5000/sonar
    tag: admin
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 0
      allowPrivilegeEscalation: false
    volumeMounts:
      - name: sonar
        mountPath: /opt/sonarqube/*/*/*
        size: 2Gi
        hostPath: /home/jenkins/helm-jenkins-sonar-nexus-data/sonar

persistence:
  storageClassName: manual
  reclaimPolicy: Retain

service:
  - protocol: TCP


VolumeMount:
  - name: jenkins-vm
    mountPath: /var/jenkins_home/

